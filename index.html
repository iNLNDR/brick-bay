<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A pirate-island learning game for Cambridge Primary Maths, Science and English.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Brick Bay Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2a1f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brick Bay">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: sea-blue world; sticky player bar on top, tab bar on the bottom (thumb reach on phone/iPad); content in chunky cards. */
:root{
  --sea:#2bb3c9; --foam:#e9fbff;
  --brick:#e8442e; --brick-dk:#b42d1b;
  --sun:#ffc531; --sun-dk:#d99a00;
  --leaf:#3fbf5a; --leaf-dk:#26923f;
  --sky:#4b7bf5; --sky-dk:#2f56c4;
  --grape:#9b6bff; --grape-dk:#7346d6;
  --plum:#2a1f4a; --plum-2:#3b2f66; --plum-txt:#d7d1ff;
  --ink:#2a1f4a; --ink-soft:#5d5482;
  --card:#ffffff; --card-2:#f1f5ff; --line:#d9e1f5;
  --good:#1f9a46; --bad:#d93636; --wait:#c98a00;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#123d5c; --foam:#cfe9ff; --card:#1f2346; --card-2:#272c58; --line:#3a4078;
  --ink:#f3f1ff; --ink-soft:#b9b4e0; --good:#3fcf6c; --bad:#ff6b6b; --wait:#ffc531; color-scheme:dark }}
:root[data-theme="dark"]{
  --sea:#123d5c; --foam:#cfe9ff; --card:#1f2346; --card-2:#272c58; --line:#3a4078;
  --ink:#f3f1ff; --ink-soft:#b9b4e0; --good:#3fcf6c; --bad:#ff6b6b; --wait:#ffc531; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--sea);
  background-image:radial-gradient(circle at 20px 20px,color-mix(in srgb,var(--foam) 18%,transparent) 2px,transparent 3px),
                   radial-gradient(circle at 60px 50px,color-mix(in srgb,var(--foam) 12%,transparent) 2px,transparent 3px);
  background-size:80px 70px;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;min-height:100%;
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--plum)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:.5px;line-height:1.1}
svg.px{shape-rendering:crispEdges;image-rendering:pixelated}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--plum);color:#fff;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.bar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}
.who{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:4px 8px 4px 4px;border-radius:14px;text-align:left}
.who:hover{background:var(--plum-2)}
.who .face{width:44px;height:44px;flex:none;background:var(--plum-2);border-radius:10px;padding:3px}
.who b{font-family:var(--display);font-size:19px;display:block;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:12ch}
.who small{color:var(--plum-txt);font-weight:600;font-size:13px}
.xp{flex:1 1 120px;min-width:80px}
.xp-track{height:14px;border-radius:4px;background:#463a74;overflow:hidden}
.xp-fill{height:100%;background:repeating-linear-gradient(90deg,var(--sun) 0 10px,#ffe27a 10px 12px);transition:width .5s}
.xp small{display:block;font-size:12px;color:var(--plum-txt);font-weight:600;margin-top:2px;white-space:nowrap}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:5px;background:var(--plum-2);border-radius:99px;padding:3px 10px 3px 4px;font-weight:800;font-variant-numeric:tabular-nums}
.pill i{width:22px;height:22px;border-radius:50%;flex:none}
.coin{background:radial-gradient(circle at 35% 35%,#fff3b0,var(--sun) 55%,var(--sun-dk));box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.fire{background:radial-gradient(circle at 50% 70%,#ffe27a,#ff8a2b 55%,var(--brick))}
.mute{background:var(--plum-2);border:0;color:#fff;border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--plum);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 0 rgba(0,0,0,.18)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tabs button{background:none;border:0;color:var(--plum-txt);border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:13px}
.tabs button svg{width:26px;height:26px}
.tabs button[aria-current="true"]{background:var(--sun);color:var(--plum)}

main{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px calc(110px + env(safe-area-inset-bottom,0px))}

/* buttons */
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;font-size:17px;background:var(--sun);color:var(--plum);box-shadow:0 5px 0 var(--sun-dk);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--sun-dk)}
.btn.red{background:var(--brick);color:#fff;box-shadow:0 5px 0 var(--brick-dk)}
.btn.green{background:var(--leaf);color:#fff;box-shadow:0 5px 0 var(--leaf-dk)}
.btn.blue{background:var(--sky);color:#fff;box-shadow:0 5px 0 var(--sky-dk)}
.btn.grape{background:var(--grape);color:#fff;box-shadow:0 5px 0 var(--grape-dk)}
.btn.ghost{background:var(--card-2);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.sm{padding:6px 12px;font-size:15px;box-shadow:0 3px 0 var(--sun-dk)}
.btn.sm.ghost{box-shadow:0 3px 0 var(--line)} .btn.sm.red{box-shadow:0 3px 0 var(--brick-dk)} .btn.sm.green{box-shadow:0 3px 0 var(--leaf-dk)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 7px 0 rgba(0,0,0,.15)}
.sec-title{color:#fff;font-size:26px;margin:24px 0 12px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:12px;font-weight:800;color:var(--ink-soft)}
.muted{color:var(--ink-soft);font-weight:600;margin:4px 0 0}

/* who's playing */
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.player{background:var(--card);border:0;border-radius:22px;padding:16px;box-shadow:0 7px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.player:hover{transform:translateY(-3px)}
.player .face{width:96px;height:96px;background:var(--card-2);border-radius:16px;padding:8px}
.player b{font-family:var(--display);font-size:22px}
.player small{color:var(--ink-soft);font-weight:700}
.player.add{border:4px dashed var(--line);box-shadow:none;background:transparent;color:#fff;justify-content:center;min-height:200px}
.player.add b{font-size:48px;line-height:1}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:14px}
input,select,textarea{font:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:3px solid var(--line);background:var(--card-2);color:var(--ink);min-width:0;width:100%}
textarea{font-size:13px;font-family:ui-monospace,Menlo,monospace;min-height:80px}

.avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:10px}
.av{border:4px solid transparent;background:var(--card-2);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:14px;position:relative}
.av svg{width:60px;height:60px}
.av[aria-pressed="true"]{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 20%,var(--card))}
.av.locked svg{filter:grayscale(1) brightness(.5);opacity:.5}
.av.locked small{color:var(--ink-soft)}
.av small{font-size:12px;font-weight:700;color:var(--ink-soft)}

/* map */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.hero-main{background:var(--plum);color:#fff;border-radius:22px;padding:22px;position:relative;overflow:hidden;box-shadow:0 7px 0 rgba(0,0,0,.2);display:flex;gap:16px;align-items:center}
.hero-main .big-face{width:120px;height:120px;flex:none;background:var(--plum-2);border-radius:18px;padding:10px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.hero-main h1{font-size:clamp(26px,4.4vw,40px)}
.hero-main h1 span{color:var(--sun)}
.hero-main p{color:var(--plum-txt);margin:8px 0 14px;max-width:44ch}
.goal{display:flex;flex-direction:column;gap:10px}
.goal h2{font-size:24px}
.bricks{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
.bricks i{aspect-ratio:1.4;border-radius:3px;background:var(--line)}
.bricks i.on{background:var(--brick);box-shadow:inset 0 -3px 0 var(--brick-dk)}
.next-reward{display:flex;gap:12px;align-items:center;background:var(--card-2);border-radius:14px;padding:10px}
.next-reward svg{width:40px;height:40px;flex:none}
.next-reward .t{height:10px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.next-reward .t i{display:block;height:100%;background:var(--sun)}
.islands{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.island{display:flex;flex-direction:column;gap:10px;min-width:0;padding:14px 16px 18px}
.island svg{width:100%;height:auto;display:block;border-radius:14px}
.island h3{font-size:26px}
.subj{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:1.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:13px;font-weight:700;padding:1px 10px;border-radius:99px;background:var(--card-2);color:var(--ink-soft)}
.isl-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.stars{display:flex;gap:3px}
.stars i{width:20px;height:20px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:var(--line)}
.stars i.on{background:var(--sun)}
.c-math{color:var(--brick)} .c-sci{color:var(--leaf)} .c-eng{color:var(--sky)}

/* quest */
.quest{max-width:760px;margin:0 auto;background:var(--card);border-radius:26px;box-shadow:0 9px 0 rgba(0,0,0,.18);overflow:hidden}
.q-head{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff;flex-wrap:wrap}
.q-head h2{font-size:22px;flex:1;min-width:0}
.q-head .x{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:10px;padding:4px 12px;font-weight:800}
.prog{display:flex;gap:4px}
.prog i{width:24px;height:12px;border-radius:3px;background:rgba(255,255,255,.3)}
.prog i.ok{background:#fff} .prog i.no{background:rgba(0,0,0,.35)} .prog i.now{background:var(--sun)}
.q-body{padding:20px 18px 22px;display:flex;flex-direction:column;gap:16px}
.q-strand{display:flex;justify-content:space-between;gap:10px;align-items:center}
.speak{border:0;background:var(--card-2);border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px}
.passage{background:var(--card-2);border-left:6px solid var(--sky);border-radius:10px;padding:12px 14px}
.q-text{font-size:clamp(22px,3.6vw,30px);font-weight:800;line-height:1.25;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:14px;text-align:left;font-weight:700;font-size:19px;box-shadow:0 5px 0 var(--line);display:flex;gap:12px;align-items:center;min-width:0}
.opt b{flex:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-family:var(--display)}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt.right{border-color:var(--good);box-shadow:0 5px 0 var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.opt.wrong{border-color:var(--bad);box-shadow:0 5px 0 var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.opt:disabled{cursor:default}
.fb{border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fb.good{background:color-mix(in srgb,var(--good) 16%,var(--card))} .fb.bad{background:color-mix(in srgb,var(--bad) 13%,var(--card))}
.fb > div{flex:1 1 240px;min-width:0}
.fb strong{font-family:var(--display);font-size:22px;display:block}
.fb p{margin:2px 0 0;font-weight:600}
.combo{font-family:var(--display);color:var(--brick);font-size:20px}
.result{text-align:center;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.result h2{font-size:clamp(28px,5vw,40px)}
.result .face{width:110px;height:110px;animation:bob 1.2s ease-in-out infinite}
.stats3{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stats3 div{background:var(--card-2);border-radius:14px;padding:8px 16px;min-width:100px}
.stats3 b{font-family:var(--display);font-size:28px;display:block;font-variant-numeric:tabular-nums}
.stats3 small{font-weight:700;color:var(--ink-soft)}

/* crew */
.hatch{background:var(--plum);color:#fff;border-radius:22px;padding:20px;display:flex;gap:18px;align-items:center;box-shadow:0 7px 0 rgba(0,0,0,.2);flex-wrap:wrap}
.egg{width:90px;height:112px;flex:none;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;background:repeating-linear-gradient(45deg,var(--sun) 0 14px,#ffd866 14px 28px);box-shadow:inset -10px -8px 0 rgba(0,0,0,.15)}
.egg.shake{animation:shake .45s 2}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.hatch h2{font-size:24px} .hatch p{color:var(--plum-txt);margin:4px 0 12px}
.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.pet{background:var(--card);border-radius:18px;padding:12px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.pet svg{width:100%;max-width:100px;height:auto}
.pet h3{font-size:19px} .pet p{margin:2px 0 0;font-size:14px;color:var(--ink-soft);font-weight:600}
.pet.locked svg{filter:brightness(0);opacity:.2}
.pet.new{animation:pop .6s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}

/* rewards */
.wallet{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.wallet .big{font-family:var(--display);font-size:44px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:10px;line-height:1}
.wallet .big i{width:40px;height:40px;border-radius:50%}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.prize{display:flex;flex-direction:column;gap:8px;padding:16px}
.prize .ico{width:64px;height:64px;background:var(--card-2);border-radius:14px;padding:8px}
.prize h3{font-size:20px}
.price{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums}
.price i{width:18px;height:18px;border-radius:50%}
.bar2{height:10px;background:var(--line);border-radius:3px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--sun)}
.claims{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.claim{display:flex;gap:12px;align-items:center;background:var(--card-2);border-radius:12px;padding:8px 12px;flex-wrap:wrap}
.claim svg{width:32px;height:32px;flex:none}
.claim > div{flex:1 1 160px;min-width:0}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-weight:800;font-size:13px;color:#fff}
.chip.wait{background:var(--wait);color:#2a1f4a} .chip.ok{background:var(--good)} .chip.no{background:var(--bad)}

/* leaders */
.seg{display:inline-flex;background:var(--card);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 14px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--plum)}
.board{display:flex;flex-direction:column;gap:10px}
.lrow{display:grid;grid-template-columns:44px 56px 1fr auto;gap:12px;align-items:center;padding:10px 14px}
.lrow.me{outline:4px solid var(--sun)}
.rank{font-family:var(--display);font-size:24px;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--card-2)}
.rank.r1{background:#ffcf3a;color:#2a1f4a} .rank.r2{background:#cfd6e6;color:#2a1f4a} .rank.r3{background:#e09a5a;color:#2a1f4a}
.lrow .face{width:56px;height:56px;background:var(--card-2);border-radius:12px;padding:4px}
.lrow b{font-family:var(--display);font-size:20px;display:block}
.lrow small{color:var(--ink-soft);font-weight:700}
.lrow .score{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;text-align:right}

/* grown-ups */
.gsec{margin-bottom:16px}
.gsec h2{font-size:24px;margin-bottom:6px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.li{display:flex;gap:10px;align-items:center;background:var(--card-2);border-radius:12px;padding:8px 10px;flex-wrap:wrap}
.li svg{width:36px;height:36px;flex:none}
.li .grow{flex:1 1 150px;min-width:0}
.li input{width:110px;padding:6px 10px}
.acc-row{display:grid;grid-template-columns:110px 1fr 56px;gap:12px;align-items:center;margin-top:8px}
.acc-row .t{height:16px;border-radius:4px;background:var(--card-2);overflow:hidden}
.acc-row .t i{display:block;height:100%}
.acc-row b{font-variant-numeric:tabular-nums;text-align:right}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:420px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:2px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-soft)}
.pin{max-width:360px;margin:40px auto;text-align:center;display:flex;flex-direction:column;gap:12px}
.pin input{text-align:center;font-size:30px;letter-spacing:12px;font-family:var(--display)}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(200%);opacity:0;background:var(--plum);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:.3s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translateX(-50%);opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:15;width:100%;height:100%}

@media (max-width:860px){.hero{grid-template-columns:1fr}.islands{grid-template-columns:1fr}}
@media (max-width:560px){
  .opts{grid-template-columns:1fr}
  .xp small{display:none}
  .who b{max-width:8ch;font-size:17px} .who small{display:none}
  .hero-main{flex-direction:column;text-align:center}
  .hero-main .big-face{width:96px;height:96px}

function misspell(w){const out=new Set(),add=x=>{if(x&&x!==w&&x.length>1)out.add(x)};
  add(w.replace('ie','ei'));add(w.replace('ei','ie'));const dbl=w.match(/([bcdfglmnprst])\1/);if(dbl)add(w.replace(dbl[0],dbl[1]));
  const sg=w.match(/[aeiou]([bcdfglmnprst])[aeiou]/);if(sg)add(w.replace(sg[0],sg[0][0]+sg[1]+sg[1]+sg[0][2]));
  add(w.replace(/c/,'k'));add(w.replace(/ph/,'f'));add(w.replace(/ough/,'ow'));add(w.replace(/ay/,'ai'));add(w.replace(/(.)e$/,'$1'));
  let g=0;while(out.size<3&&g++<40){const i=R(1,w.length-2);if(Math.random()<.5)add(w.slice(0,i)+w.slice(i+1));else add(w.slice(0,i)+w[i+1]+w[i]+w.slice(i+2))}
  return sample([...out],3)}

function wrongPast(b,r){const e=b.endsWith('e')?b+'d':b+'ed';return [e,b+'ed',b+'d',b+b.slice(-1)+'ed',r+'ed',b.replace(/y$/,'ied'),b+'s'].filter(x=>x!==r)}

function prepSVG(pos){const ball=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="18" fill="#e8442e" stroke="var(--ink)" stroke-width="3"/><path d="M${cx-18} ${cy} Q${cx} ${cy-10} ${cx+18} ${cy}" stroke="#fff" stroke-width="3" fill="none"/>`;
  const legs=`<rect x="84" y="128" width="10" height="34" fill="#a86b33" stroke="var(--ink)" stroke-width="2"/><rect x="166" y="128" width="10" height="34" fill="#a86b33" stroke="var(--ink)" stroke-width="2"/>`;
  const back=`<rect x="76" y="70" width="108" height="20" fill="#c98b4a" stroke="var(--ink)" stroke-width="3"/>`;
  const front=`<rect x="76" y="82" width="108" height="48" rx="3" fill="#e0a55e" stroke="var(--ink)" stroke-width="3"/><path d="M90 96 H170 M90 112 H170" stroke="#c98b4a" stroke-width="3"/>`;
  const floor=`<rect x="0" y="162" width="260" height="8" fill="var(--line)"/>`;
  let b='';if(pos==='in')b=ball(130,84);if(pos==='on')b=ball(130,51);if(pos==='under')b=ball(130,143);if(pos==='next to')b=ball(218,143);
  const order=pos==='in'?back+b+front:back+front+b;
  return `<svg viewBox="0 0 260 172" role="img" aria-label="A ball and a box">${floor}${legs}${order}</svg>`}

function finalize(raw,subj){const q={...raw,subj,kind:raw.kind||'mc'};
  if(q.id==='wordclass'||(raw.why&&raw.why.includes('"X"')))q.why=raw.why.replace('X',raw.a);
  if(q.kind==='mc'){q.a=String(q.a);const w=[...new Set((q.w||[]).map(String))].filter(x=>x!==q.a);q.opts=shuffle([q.a,...w.slice(0,3)]);
    if(q.num&&/^-?[\d,]+(\.\d+)?$/.test(q.a)&&Math.random()<.4){q.kind='input';delete q.opts}}
  if(q.kind==='order'){let it;let g=0;do{it=shuffle(q.a)}while(it.join('|')===q.a.join('|')&&g++<10);q.items=it}
  if(q.kind==='spell'){q.a=String(q.a);let it,g=0;do{it=shuffle([...q.a])}while(it.join('')===q.a&&g++<10);q.items=it}
  if(q.kind==='match'){q.right=shuffle(q.pairs.map(p=>p[1]))}
  delete q.w;q.sig=subj+'|'+q.q+'|'+(Array.isArray(q.a)?q.a.join(','):q.kind==='match'?q.pairs.map(p=>p.join('=')).join(','):q.a);
  return q}
function weightedPick(gs){const tot=gs.reduce((s,g)=>s+g.w,0);let r=Math.random()*tot;for(const g of gs){r-=g.w;if(r<=0)return g}return gs[gs.length-1]}
function genOne(subj,st,avoid,d=2){const gs=GENS[subj].filter(g=>st>=g.lo&&st<=g.hi&&(g.dmin||1)<=d);let q,g=0;
  do{q=finalize(weightedPick(gs).f(st,d),subj)}while(avoid&&avoid.has(q.sig)&&g++<15);q.st=st;q.d=d;return q}
function checkInput(q,val){const n=s=>String(s).trim().toLowerCase().replace(/[,\s]/g,'').replace(/^\+/,'');const a=n(q.a),v=n(val);if(!v)return false;
  if(a===v)return true;const fa=parseFloat(a),fv=parseFloat(v);return /^-?[\d.]+$/.test(a)&&/^-?[\d.]+$/.test(v)&&Math.abs(fa-fv)<1e-9}

const SP_STEP=10,SP_STAGE=30;

/* ---- adaptive difficulty ---- */
function track(p,subj,ok){const r=p.recent[subj];r.push(ok?1:0);if(r.length>12)r.shift();
  if(r.length>=8){const acc=r.reduce((a,b)=>a+b,0)/r.length;
    if(acc<.5&&(p.sp[subj]||0)<4&&p.stage+p.adj[subj]>0){p.adj[subj]--;p.sp[subj]=15;p.recent[subj]=[];return 'down'}}return null}

/* ---- spaced repetition of mistakes ---- */
function addMistake(p,q){const c={...q};delete c.rev;const ex=p.review.find(r=>r.q.sig===q.sig);
  if(ex){ex.box=0;ex.due=Date.now()+DAY}else{p.review.push({q:c,box:0,due:Date.now()+DAY});if(p.review.length>60)p.review.shift()}}
function reviewRight(p,q){const ex=p.review.find(r=>r.q.sig===q.sig);if(!ex)return false;ex.box++;
  if(ex.box>=REVIEW_GAPS.length){p.review=p.review.filter(r=>r!==ex);return 'mastered'}ex.due=Date.now()+REVIEW_GAPS[ex.box]*DAY;return 'kept'}
const dueReviews=(p,subj)=>p.review.filter(r=>r.due<=Date.now()&&(!subj||r.q.subj===subj));

/* ---- quests ---- */
function freshForQuest(q){const c=finalize({...q},q.subj);c.rev=true;return c}
function buildList(p,mode,subj,n){const list=[],avoid=new Set();
  if(mode==='review'){const pool=dueReviews(p).concat(p.review.filter(r=>r.due>Date.now()).sort((a,b)=>a.due-b.due));
    pool.slice(0,n).forEach(r=>{const q={...r.q,rev:true};list.push(q);avoid.add(q.sig)});return list}
  if(mode==='mystery'){for(let i=0;i<n;i++){const s=SUBJS[i%3];const e=effStage(p,s),st=e===0?0:Math.min(6,e+1);const q=genOne(s,st,new Set([...avoid,...p.seen[s]]),e===0?stepOf(p,s):2);list.push(q);avoid.add(q.sig)}return shuffle(list)}
  if(mode==='normal'){dueReviews(p,subj).slice(0,2).forEach(r=>{const q={...r.q,rev:true};list.push(q);avoid.add(q.sig)})}
  const st=effStage(p,subj),d=stepOf(p,subj);const seen=new Set(p.seen[subj]);
  /* step 1 mixes in some easier questions, step 3 previews the next stage (not used for stage 0, whose step changes the questions directly) */
  while(list.length<n){const r=Math.random(),av=new Set([...avoid,...seen]);let q;
    if(st>1&&d===1&&r<.25)q=genOne(subj,st-1,av,3);else if(st>0&&st<6&&d===3&&r<.25)q=genOne(subj,st+1,av,1);else q=genOne(subj,st,av,d);
    list.push(q);avoid.add(q.sig)}
  return mode==='normal'?shuffle(list):list}
function remember(p,q){const s=p.seen[q.subj];s.push(q.sig);if(s.length>50)s.shift()}

let AC=null;
function tone(fs,dur=.12,type='square'){if(F.muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const t=AC.currentTime+i*dur;
    g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+dur*1.6);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur*1.7)})}catch(e){}}

const NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|junior|organ|superstar|trinoids|whisper|wobble|zarvox|fred|ralph|kathy|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley/i;
function voiceScore(v,lang){const id=(v.name+' '+(v.voiceURI||'')).toLowerCase();let s=0;
  if(NOVELTY.test(v.name))return -99;
  if(/premium/.test(id))s+=8;if(/enhanced/.test(id))s+=6;if(/natural|neural|online/.test(id))s+=6;if(/google/.test(id))s+=4;if(/siri/.test(id))s+=4;
  if(v.lang===lang||v.lang===lang.replace('-','_'))s+=3;else if(lang==='en-GB'&&/^en[-_](US|AU|IE)/.test(v.lang))s+=1;
  if(/serena|daniel|kate|martha|arthur|stephanie|libby|sonia|ryan|samantha|ava|zoe|damayanti|gadis|ardi/i.test(v.name))s+=1;
  if(v.localService===false)s+=1;return s}
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){VOICES=[]}return VOICES}
function voicesFor(lang){const pre=lang.slice(0,2);return loadVoices().filter(v=>v.lang&&v.lang.slice(0,2).toLowerCase()===pre).map(v=>({v,s:voiceScore(v,lang)})).filter(x=>x.s>-50).sort((a,b)=>b.s-a.s)}
function voiceFor(lang){const key=lang.startsWith('id')?F.voiceId:F.voiceEn;const list=voicesFor(lang);
  if(key){const m=list.find(x=>x.v.voiceURI===key||x.v.name===key);if(m)return m.v}return list[0]?list[0].v:null}

  const base=F.rate||1;u.rate=(rate||(P()&&isStarter(P())?.85:.95))*base;u.pitch=1;speechSynthesis.speak(u)}catch(e){toast('Read aloud is not available on this device')}}

/* --- quest engine --- */
function startQuest(mode,key){const p=P();const n=mode==='boss'?8:isStarter(p)?5:6;const subj=mode==='normal'||mode==='boss'?key:mode==='mystery'?'mix':'review';
  const list=buildList(p,mode,key,n);if(!list.length){toast('Nothing to fix right now');return}
  Q={mode,key:subj,list,i:0,res:[],combo:0,xp:0,c:0,answered:false,boss:mode==='boss'?{hp:6,max:6,hearts:3}:null,quick:0,mastered:0,levelChange:null};view='quest';render()}
function qColor(){return SUBJ[Q.key]?SUBJ[Q.key]:{name:'Fix my mistakes',col:'var(--brick)',dk:'var(--brick-dk)',btn:'red'}}
function headHTML(){const s=qColor(),title=Q.mode==='review'?'Fix my mistakes':Q.mode==='boss'?BOSSES[Q.key].name:s.name;
  const prog=Q.boss?'':`<div class="prog">${Q.list.map((_,i)=>`<i class="${i<Q.i?(Q.res[i]?'ok':'no'):i===Q.i?'now':''}"></i>`).join('')}</div>`;
  const boss=Q.boss?`<div class="bossbar"><div class="boss-face">${pixel(BOSSES[Q.key].map,BOSSES[Q.key].pal,BOSSES[Q.key].name)}</div><div style="flex:1;min-width:0"><div class="hp"><i style="width:${Q.boss.hp/Q.boss.max*100}%"></i></div><small>Boss health ${Q.boss.hp}/${Q.boss.max}</small></div><div class="hearts">${[0,1,2].map(i=>heartSVG(i<Q.boss.hearts)).join('')}</div></div>`:'';
  return `<div class="q-head" style="background:${Q.boss?'var(--grape)':s.col}"><h2>${esc(title)}</h2>${prog}<button class="x" data-view="map">Leave</button>${boss}</div>`}
function renderQuest(){const q=Q.list[Q.i];const s=SUBJ[q.subj];Q.answered=false;Q.shownAt=Date.now();Q.work=null;
  const L=['A','B','C','D'],lc=['var(--brick)','var(--sun-dk)','var(--plum)','var(--sky-dk)'];let body='';
  const kid=q.st===0,pl=P();
  if(q.kind==='mc')body=`<div class="opts ${q.opts.length===2?'two':''} ${q.opts.length===3&&q.optPics?'three':''} ${q.bars?'bars':''}">${q.opts.map((o,i)=>q.optPics?`<button class="opt pic" data-opt="${i}" aria-label="${esc(o)}"><span class="pic">${q.optPics[o]}</span>${q.picOnly?'':`<span class="w">${esc(o)}</span>`}</button>`:`<button class="opt" data-opt="${i}"><b style="background:${lc[i]}">${L[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>`;
  if(q.kind==='input')body=`<form class="in-row" id="inForm"><input id="ans" inputmode="${/[a-z]/i.test(q.a)?'text':'decimal'}" autocomplete="off" placeholder="Answer" aria-label="Your answer"><button class="btn ${s.btn}" type="submit">Check</button></form>${kid?'':'<p class="muted" style="margin:0;font-size:14px">Type the number. No need for commas.</p>'}`;
  if(q.kind==='order'||q.kind==='spell'){Q.work={picked:[],pool:q.items.map((t,i)=>i)};body=`<div class="slot" id="slot" aria-label="Your answer"></div><div class="tiles" id="pool"></div><div class="row"><button class="btn ${s.btn}" id="chk" disabled>Check</button><button class="btn ghost" id="clr">Clear</button></div>`}
  if(q.kind==='match'){Q.work={sel:null,done:new Set(),miss:0};body=`<div class="match"><div class="col" id="mL">${q.pairs.map((p,i)=>`<button class="mt" data-ml="${i}">${esc(p[0])}</button>`).join('')}</div><div class="col" id="mR">${q.right.map((r,i)=>`<button class="mt" data-mr="${i}">${esc(r)}</button>`).join('')}</div></div>${kid?'':'<p class="muted" style="margin:0;font-size:14px">Tap a word on the left, then its partner on the right.</p>'}`}
  const kindLabel={mc:'',input:'Type it',order:'Put in order',spell:'Spell it',match:'Match pairs'}[q.kind];
  const idn=pl.indo?(q.idn||IDN_KIND[q.kind]):'';
  app.innerHTML=`<section class="quest">${headHTML()}<div class="q-body ${kid?'starter':''}">
   <div class="q-strand"><span class="eyebrow">${s.subject} · ${q.s}${q.rev?' · <span class="revtag">Mistake to fix</span>':''}${kindLabel&&!kid?` · ${kindLabel}`:''}</span><button class="speak ${kid?'big':''}" id="speakBtn">${kid?'Hear again':'Read aloud'}</button></div>
   ${q.p?`<div class="passage">${esc(q.p)}</div>`:''}<div class="q-text">${esc(q.q)}</div>
   ${idn?`<p class="idn"><span class="tag">ID</span><span class="t">${esc(idn)}</span><button id="idnBtn" type="button">Dengar</button></p>`:''}
   ${q.vis?`<div class="vis">${q.vis}</div>`:''}${body}<div id="fb"></div></div></section>`;
  const prompt=(q.p?q.p+' ':'')+(q.say||q.q);
  const full=prompt+(q.kind==='mc'&&!q.picOnly?(kid?'. '+q.opts.join('? ')+'?':'. '+q.opts.map((o,i)=>L[i]+': '+o).join('. ')):'');
  document.getElementById('speakBtn').onclick=()=>speak(full);
  const ib=document.getElementById('idnBtn');if(ib)ib.onclick=()=>speak(idn,'id-ID',.9);
  if(pl.autoRead)speak(kid?prompt:(q.say||q.q));
  if(q.kind==='mc')app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{const i=+b.dataset.opt;
    app.querySelectorAll('[data-opt]').forEach((x,j)=>{x.disabled=true;if(q.opts[j]===q.a)x.classList.add('right');else if(j===i)x.classList.add('wrong')});submit(q.opts[i]===q.a,q.opts[i])});
  if(q.kind==='input'){const f=document.getElementById('inForm'),inp=document.getElementById('ans');setTimeout(()=>inp.focus(),50);
    f.onsubmit=e=>{e.preventDefault();if(Q.answered||!inp.value.trim())return;inp.disabled=true;f.querySelector('button').disabled=true;const ok=checkInput(q,inp.value);inp.classList.add(ok?'right':'wrong');submit(ok,inp.value)}}
  if(q.kind==='order'||q.kind==='spell')drawTiles(q);
  if(q.kind==='match')bindMatch(q)}
function drawTiles(q){const w=Q.work,sep=q.kind==='spell';
  document.getElementById('slot').innerHTML=w.picked.length?w.picked.map((i,k)=>`<button class="tile ${sep?'letter':''} in" data-back="${k}">${esc(q.items[i])}</button>`).join(q.kind==='order'&&q.subj!=='eng'||q.id==='cycle'?'<span class="arrow">→</span>':''):`<span class="muted" style="margin:0">${sep?'Tap the letters to spell the word':'Tap the tiles in the right order'}</span>`;
  document.getElementById('pool').innerHTML=w.pool.map(i=>`<button class="tile ${sep?'letter':''}" data-take="${i}">${esc(q.items[i])}</button>`).join('');
  document.getElementById('chk').disabled=w.pool.length>0||Q.answered;
  app.querySelectorAll('[data-take]').forEach(b=>b.onclick=()=>{if(Q.answered)return;const i=+b.dataset.take;w.pool=w.pool.filter(x=>x!==i);w.picked.push(i);sfx.tap();drawTiles(q)});
  app.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{if(Q.answered)return;const k=+b.dataset.back;w.pool.push(w.picked[k]);w.picked.splice(k,1);drawTiles(q)});
  document.getElementById('clr').onclick=()=>{if(Q.answered)return;w.pool=w.pool.concat(w.picked);w.picked=[];drawTiles(q)};
  document.getElementById('chk').onclick=()=>{if(Q.answered)return;const given=w.picked.map(i=>q.items[i]);const ok=sep?given.join('')===q.a:given.join('|')===q.a.join('|');
    document.getElementById('slot').classList.add(ok?'right':'wrong');app.querySelectorAll('.tile').forEach(t=>t.disabled=true);document.getElementById('chk').disabled=true;submit(ok,sep?given.join(''):given.join(' → '))}}
function bindMatch(q){const w=Q.work;
  const L=app.querySelectorAll('[data-ml]'),Rb=app.querySelectorAll('[data-mr]');
  L.forEach(b=>b.onclick=()=>{if(Q.answered||w.done.has(+b.dataset.ml))return;L.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');w.sel=+b.dataset.ml;sfx.tap()});
  Rb.forEach(b=>b.onclick=()=>{if(Q.answered||w.sel===null||b.classList.contains('right'))return;const li=w.sel,val=q.right[+b.dataset.mr];
    if(q.pairs[li][1]===val){w.done.add(li);L[li].classList.remove('sel');L[li].classList.add('right');b.classList.add('right');L[li].disabled=true;b.disabled=true;w.sel=null;sfx.good();
      if(w.done.size===q.pairs.length)submit(w.miss===0,w.miss?`${w.miss} wrong tr${w.miss===1?'y':'ies'}`:'all matched')}
    else{w.miss++;b.classList.add('wrong');L[li].classList.add('wrong');sfx.bad();setTimeout(()=>{b.classList.remove('wrong');L[li].classList.remove('wrong')},450)}})}

function ansHTML(q){if(q.optPics&&q.optPics[q.a])return `<span class="ans-pic">${q.optPics[q.a]}</span> ${esc(q.a)}`;return esc(answerText(q))}
function answerText(q){if(q.kind==='order')return q.a.join(' → ');if(q.kind==='match')return q.pairs.map(p=>`${p[0]} = ${p[1]}`).join(', ');return q.a}
function submit(ok,given){if(Q.answered)return;Q.answered=true;const p=P();rollDay(p);const q=Q.list[Q.i];Q.res[Q.i]=ok;
  const st=p.stats[q.subj],sk=q.subj+':'+q.s;st.t++;p.strands[sk]=p.strands[sk]||{c:0,t:0};p.strands[sk].t++;p.today.n++;remember(p,q);
  let extra='',coinsGot=0;
  const minT=q.kind!=='mc'?0:q.st===0?Math.min(4500,1300+(q.say||q.q).length*55):Math.min(4000,1200+q.q.length*22+(q.p?q.p.length*8:0)),tooQuick=ok&&minT&&(Date.now()-Q.shownAt)<minT;
  if(ok){st.c++;p.strands[sk].c++;Q.combo++;
    if(tooQuick){Q.quick++;addXP(4);Q.xp+=4;extra=`<span class="note">${q.st===0?'Listen first, then tap!':'Too quick to count for coins. Read carefully first!'}</span>`}
    else{let c=5+(Q.combo>=3?3:0)+(q.rev?3:0);coinsGot=earn(p,c);Q.c+=coinsGot;addXP(10);Q.xp+=10;if(Q.combo>=3)extra=`<span class="combo">Combo ×${Q.combo}!</span>`}
    if(q.rev){const r=reviewRight(p,q);if(r==='mastered'){Q.mastered++;extra+=`<span class="combo">Mastered!</span>`}}
    if(Q.boss){Q.boss.hp--;sfx.hit()}else sfx.good()}
  else{Q.combo=0;addXP(2);Q.xp+=2;addMistake(p,q);sfx.bad();if(Q.boss)Q.boss.hearts--}
  if(q.subj&&Q.mode!=='review'&&Q.mode!=='mystery'){const sj=q.subj,before=stepOf(p,sj);p.sp[sj]=Math.max(0,(p.sp[sj]||0)+(ok?1:-1));
    if(p.sp[sj]>=SP_STAGE){if(effStage(p,sj)<6){p.adj[sj]++;p.sp[sj]=0;p.recent[sj]=[];Q.levelChange={subj:sj,dir:'up'};extra+=`<span class="combo">${stageName(effStage(p,sj))} unlocked!</span>`;setTimeout(()=>{sfx.win();confetti()},200)}else p.sp[sj]=SP_STAGE-1}
    else if(stepOf(p,sj)>before)extra+=`<span class="combo">Step ${stepOf(p,sj)}!</span>`;
    const ch=track(p,sj,ok);if(ch)Q.levelChange={subj:sj,dir:ch}}
  if(F.coinCap&&ok&&!tooQuick&&coinsGot===0)extra+=`<span class="note">Daily coin limit reached. XP still counts.</span>`;
  save();renderChrome();
  const bossOver=Q.boss&&(Q.boss.hp<=0||Q.boss.hearts<=0);
  if(Q.boss&&!bossOver&&Q.i===Q.list.length-1){Q.list.push(genOne(Q.key,effStage(p,Q.key),new Set(Q.list.map(x=>x.sig)),stepOf(p,Q.key)))}
  const last=bossOver||(!Q.boss&&Q.i===Q.list.length-1);
  if(Q.boss){const hp=app.querySelector('.hp i');if(hp)hp.style.width=(Math.max(0,Q.boss.hp)/Q.boss.max*100)+'%';const sm=app.querySelector('.bossbar small');if(sm)sm.textContent=`Boss health ${Math.max(0,Q.boss.hp)}/${Q.boss.max}`;const hs=app.querySelector('.hearts');if(hs)hs.innerHTML=[0,1,2].map(i=>heartSVG(i<Q.boss.hearts)).join('');const bf=app.querySelector('.boss-face');if(bf){bf.classList.remove('hit');void bf.offsetWidth;if(ok)bf.classList.add('hit')}}
  const kid=q.st===0,head=ok?(kid?pick(['Yes! Well done!','Great job!','Super!']):pick(['Brilliant!','Treasure found!','Spot on!','Full sails!'])):(kid?'Oops! Look:':pick(['Nearly there!','Good try!','Not quite!']));
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'good':'bad'} ${kid?'kidfb':''}"><div><strong>${head}</strong>
   <p>${ok?'':`The answer is <b>${ansHTML(q)}</b>. `}${esc(q.why)}</p>${!ok&&!kid?'<p class="muted" style="margin:2px 0 0;font-size:14px">This question will come back in Fix my mistakes.</p>':''}${extra?`<div class="row" style="margin-top:4px">${extra}</div>`:''}</div>
   <button class="btn ${Q.boss?'grape':qColor().btn}" id="nextBtn">${last?'See treasure':'Next'}</button></div>`;
  if(P().autoRead){const said=q.kind==='match'?'':String(q.sayAns||(Array.isArray(q.a)?q.a.join(', '):q.a));speak(ok?head.replace(/!.*$/,'!')+(kid&&said?' '+said+'.':''):(said?'The answer is '+said+'.':'Good try.'))}
  const nb=document.getElementById('nextBtn');nb.focus();nb.onclick=()=>{if(last)finish();else{Q.i++;renderQuest()}}}
function addXP(x){const p=P();const before=lvlOf(p);p.xp+=x;p.week.xp+=x;const after=lvlOf(p);
  if(after>before){earn(p,20,true);const un=AVATARS.find(a=>a.lvl===after);setTimeout(()=>{toast(`Level ${after}! +20 coins${un?`. New character: ${un.name}!`:''}`);sfx.win();confetti()},250)}}
function finish(){const p=P(),answered=Q.res.length,right=Q.res.filter(Boolean).length,acc=right/answered;let title,msg='',bonus=0;
  const t=todayKey();if(p.lastDay!==t){p.streak=p.lastDay===yesterdayKey()?p.streak+1:1;p.lastDay=t}
  if(Q.mode==='normal'){p.quests[Q.key]++;p.flags[Q.key]=Math.min(5,p.flags[Q.key]+1)}
  if(Q.mode==='boss'){const won=Q.boss.hp<=0;if(won){p.tier[Q.key]++;p.flags[Q.key]=0;p.bosses++;bonus=earn(p,60,true);title=`You beat ${BOSSES[Q.key].name}!`;msg=`${SUBJ[Q.key].name} is now island level ${p.tier[Q.key]}.${p.bosses===1?' Mystery Isle has appeared on the map!':''}`}
    else{title=`${BOSSES[Q.key].name} got away!`;msg='Practise a little, then try again. The boss is still waiting.'}}
  else{if(acc>=.8&&Q.quick<2){bonus=earn(p,acc===1?20:10);msg=`${acc===1?'Perfect':'80%+'} bonus: +${bonus} coins.`}else if(Q.quick>=2)msg='Some answers were too quick, so no quest bonus this time.';
    if(Q.mode==='mystery')bonus+=earn(p,10);
    title=acc===1?'Perfect voyage!':acc>=.5?'Great sailing!':'Every captain practises!'}
  if(Q.mastered)msg+=` You mastered ${Q.mastered} mistake${Q.mastered===1?'':'s'}!`;
  if(Q.levelChange){const s=SUBJ[Q.levelChange.subj].subject;msg+=Q.levelChange.dir==='up'?` ${s} moved up to ${stageName(effStage(P(),Q.levelChange.subj))}!`:` ${s} will be a bit easier for a while.`}
  Q.c+=bonus;save();renderChrome();sfx.win();if(acc>=.8||(Q.boss&&Q.boss.hp<=0))confetti();const s=Q.boss?{col:'var(--grape)',btn:'grape'}:qColor();

  app.innerHTML=`<section class="quest"><div class="q-head" style="background:${s.col}"><h2>${Q.mode==='boss'?'Boss battle':Q.mode==='review'?'Fix my mistakes':esc(qColor().name)}</h2></div><div class="result">
   <div class="face">${Q.boss&&Q.boss.hp<=0?pixel(BOSSES[Q.key].map,BOSSES[Q.key].pal,''):avSVG(p.avatar)}</div><h2>${title}</h2>
   <p>You got <b>${right} of ${answered}</b> right. ${esc(msg)}</p>
   <div class="stats3"><div><b>+${Q.xp}</b><small>XP</small></div><div><b>+${Q.c}</b><small>coins</small></div><div><b>${p.streak}</b><small>day streak</small></div></div>
   <div class="row" style="justify-content:center;margin-top:8px">${again}<button class="btn" data-view="shop">Rewards</button><button class="btn ghost" data-view="map">Islands</button></div></div></section>`;
  document.getElementById('tabs').hidden=false}

  document.getElementById('snd').onclick=()=>{F.muted=!F.muted;reG()};
  const ve=document.getElementById('voiceEn');if(ve){ve.onchange=()=>{F.voiceEn=ve.value;save();speak('Hello! Tap the cat.')};
   const vi=document.getElementById('voiceId');vi.onchange=()=>{F.voiceId=vi.value;save();speak('Halo! Ketuk gambar kucing.','id-ID')};
   document.getElementById('rateSel').onchange=e=>{F.rate=+e.target.value;save();speak('Hello! Tap the cat.')};
   document.getElementById('testEn').onclick=()=>speak('Hello! Tap the cat. What colour is it? Well done!');
   document.getElementById('testId').onclick=()=>speak('Halo! Dengarkan, lalu ketuk gambar yang benar.','id-ID')}
}

/* ===================== ROUTER ===================== */
function render(){const p=P();if(!p&&view!=='who')view='who';if(p)rollDay(p);if(view!=='grown')grownOpen=false;renderChrome();
  ({who:renderWho,map:renderMap,quest:renderQuest,crew:renderCrew,shop:renderShop,leaders:renderLeaders,grown:renderGrown}[view]||renderMap)();window.scrollTo({top:0})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-play],[data-new],[data-go],[data-boss],[data-review],[data-mystery],[data-view]');if(!t||t.disabled)return;
  if(t.dataset.play){F.active=t.dataset.play;save();view='map';render()}
  else if(t.dataset.new){editing={};view='who';render()}
  else if(t.dataset.go)startQuest('normal',t.dataset.go);
  else if(t.dataset.boss)startQuest('boss',t.dataset.boss);
  else if(t.dataset.review)startQuest('review');
  else if(t.dataset.mystery)startQuest('mystery');
  else if(t.dataset.view){view=t.dataset.view;render()}});
document.getElementById('whoBtn').onclick=()=>{view='who';editing=null;render()};
document.getElementById('muteBtn').onclick=()=>{F.muted=!F.muted;save();renderChrome();if(!F.muted)sfx.coin()};
document.addEventListener('keydown',e=>{if(view!=='quest'||!Q||Q.answered)return;if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const q=Q.list[Q.i];if(q.kind!=='mc')return;
  let i='ABCD'.indexOf(e.key.toUpperCase());if(i<0)i='1234'.indexOf(e.key);const b=app.querySelector(`[data-opt="${i}"]`);if(b)b.click()});
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800)}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cv=document.getElementById('confetti'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#e8442e','#ffc531','#3fbf5a','#4b7bf5','#ff5fd1'];const ps=Array.from({length:80},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,s:R(6,10),vy:R(3,7),vx:R(-2,2),c:pick(cols)}));
  let f=0;(function tick(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;cx.fillStyle=p.c;cx.fillRect(p.x|0,p.y|0,p.s,p.s)});if(f++<120)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height)})()}

if(F.active&&P())view='map';
render();
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}

</script>
